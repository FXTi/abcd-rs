name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  common-files-consistency:
    name: Common files consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cross-crate shim files are identical
        run: |
          fail=0
          # The bridge shims are OURS and deliberately duplicated across the
          # two -sys crates — they must stay byte-identical.
          for f in platform_compat.h securec.h utils/logger.h; do
            a="abcd-file-sys/bridge/shim/$f"
            b="abcd-isa-sys/bridge/shim/$f"
            if [ ! -f "$a" ]; then echo "MISSING: $a"; fail=1; continue; fi
            if [ ! -f "$b" ]; then echo "MISSING: $b"; fail=1; continue; fi
            diff -q "$a" "$b" || { echo "MISMATCH: $f"; diff -u "$a" "$b"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "All common files are consistent." || exit 1

  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, common-files-consistency]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Not actions/checkout's submodules:true: it recurses and dies on
      # upstream's dangling nested gitlink (static_core/tools/plugins/
      # ecmascript has no .gitmodules mapping). And a plain submodule update
      # cannot checkout on Windows at all: upstream's tree contains
      # NTFS-illegal paths (…/test…/a.ets) and >260-char names under
      # static_core/ test trees we never compile. So: shallow blob:none
      # sparse clones limited to the subtrees the bridges actually build
      # from (isa, libpandafile, libpandabase, assembler, templates,
      # platforms). Also much faster than a full 280MB checkout.
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      # NOTE: No actions/cache here on purpose. Do NOT add it back.
      # The workspace is small and cache causes more problems than it solves
      # (stale artifacts, coverage/build conflicts, 10GB quota pressure).
      - run: cargo build
      - run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [fmt, common-files-consistency]
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      # See the build job for why: sparse, non-recursive, blob:none.
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # NOTE: No actions/cache here on purpose. Do NOT add it back.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Coverage summary
        run: |
          echo '## Coverage Report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30
