name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  vendor-check:
    name: Vendor integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: ruby abcd-isa-sys/vendor-sync.rb --check-local
      - run: ruby abcd-file-sys/vendor-sync.rb --check-local

  common-files-consistency:
    name: Common files consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify cross-crate common files are identical
        run: |
          fail=0
          # vendor-sync.rb must be identical across crates
          scripts=$(ls */vendor-sync.rb 2>/dev/null)
          if [ -n "$scripts" ]; then
            first=$(echo "$scripts" | head -1)
            for f in $scripts; do
              [ "$f" = "$first" ] && continue
              diff -q "$first" "$f" || { diff -u "$first" "$f"; fail=1; }
            done
          fi
          # Common shim files must be identical across crates
          for f in platform_compat.h securec.h utils/logger.h; do
            a="abcd-file-sys/bridge/shim/$f"
            b="abcd-isa-sys/bridge/shim/$f"
            if [ ! -f "$a" ]; then echo "MISSING: $a"; fail=1; continue; fi
            if [ ! -f "$b" ]; then echo "MISSING: $b"; fail=1; continue; fi
            diff -q "$a" "$b" || { echo "MISMATCH: $f"; diff -u "$a" "$b"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "All common files are consistent." || exit 1

  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, vendor-check, common-files-consistency]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      # NOTE: No actions/cache here on purpose. Do NOT add it back.
      # The workspace is small and cache causes more problems than it solves
      # (stale artifacts, coverage/build conflicts, 10GB quota pressure).
      - run: cargo build
      - run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [fmt, vendor-check, common-files-consistency]
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      # NOTE: No actions/cache here on purpose. Do NOT add it back.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Coverage summary
        run: |
          echo '## Coverage Report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30
