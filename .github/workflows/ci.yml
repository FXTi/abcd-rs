name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push makes every in-flight run of the same ref obsolete
# (today's stuck-2.4h-coverage incident burned a runner for nothing).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The corpus image, pinned by digest ONCE here and referenced by every
  # corpus job (design/ci-rework-plan.md Track 2). Bump deliberately: the
  # corpus suites hard-assert fixture counts (5517 rows / 1149 passed).
  # This digest bakes the 30 opcode fixtures — no local generation step —
  # plus the 156-package wild OHOS hap set behind `export-wild` (hap-file).
  ARK_TEST_IMAGE: ghcr.io/fxti/arkcompiler-test@sha256:a39526126a10b9bc5fdde3f1560ad41c66403ca046d36157d7b771e16690f70b

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # See the build job for why: sparse, non-recursive, blob:none.
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # Zero-warning estate since the 2026-10-02 debt cleanup; gate it so
      # new lints never get in.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    name: cargo deny (licenses + advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [fmt, clippy, deny]
    strategy:
      matrix:
        # Platform-compatibility lanes (2026-10-02 ruling): OS x arch cross,
        # each at the OLDEST label GitHub still offers — the point is that
        # artifacts built here keep running for ordinary users on old
        # systems. ubuntu-latest is deliberately NOT a lane: every other job
        # covers the current baseline. (The focal container lane was
        # considered and dropped; MSRV deliberately not tracked — we follow
        # the latest Rust, old-toolchain builders are on their own.)
        os:
          - ubuntu-22.04 # oldest x86_64 Linux glibc GH offers
          - ubuntu-22.04-arm # aarch64 Linux (OpenHarmony's home turf)
          - macos-14 # oldest Apple Silicon label
          - macos-15-intel # Intel Mac (macos-13 label retired — jobs queued forever)
          - windows-2022 # oldest Windows label
          - windows-11-arm # aarch64 Windows
    steps:
      - uses: actions/checkout@v4
      # Not actions/checkout's submodules:true: it recurses and dies on
      # upstream's dangling nested gitlink (static_core/tools/plugins/
      # ecmascript has no .gitmodules mapping). And a plain submodule update
      # cannot checkout on Windows at all: upstream's tree contains
      # NTFS-illegal paths (…/test…/a.ets) and >260-char names under
      # static_core/ test trees we never compile. So: shallow blob:none
      # sparse clones limited to the subtrees the bridges actually build
      # from (isa, libpandafile, libpandabase, assembler, templates,
      # platforms). Also much faster than a full 280MB checkout.
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          # protectNTFS off BEFORE the clone: git validates every index entry
          # on clone even in --sparse mode and rejects upstream's
          # NTFS-illegal paths; the sparse cone then keeps those files from
          # ever being materialized.
          git config --global core.protectNTFS false
          git config --global core.longpaths true
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # NOTE: No actions/cache here on purpose. Do NOT add it back.
      # The workspace is small and cache causes more problems than it solves
      # (stale artifacts, coverage/build conflicts, 10GB quota pressure).
      - run: cargo build
      - run: cargo test

  # 32-bit lane (2026-10-02): GH offers no 32-bit runners, so this is a
  # cross-compile + native-run lane — x86_64 kernels execute i686 binaries
  # directly once multilib is installed, no qemu needed. The vendored C++
  # bridge has never been compiled 32-bit before; this lane is the probe.
  build32:
    name: Build & Test (i686-linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - name: Install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # cc picks up CXXFLAGS/CFLAGS for the bridge; tests run natively
      # (i686 binaries execute on the x86_64 kernel once multilib exists).
      # cc reads CFLAGS/CXXFLAGS for the bridge C++ (it also auto-adds -m32
      # for i686 targets; explicit is belt-and-braces). No LDFLAGS: rustc's
      # linker driver never reads it, and the i686 target spec carries -m32
      # at link time on its own.
      - run: cargo build --target i686-unknown-linux-gnu
        env:
          CFLAGS: -m32
          CXXFLAGS: -m32
      - run: cargo test --target i686-unknown-linux-gnu
        env:
          CFLAGS: -m32
          CXXFLAGS: -m32

  # 32-bit Windows (2026-10-02 ruling): i686-pc-windows-msvc builds and
  # tests run natively under WoW64 on the 64-bit runner — no emulation.
  win32:
    name: Build & Test (i686-windows)
    runs-on: windows-2022
    timeout-minutes: 20
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.protectNTFS false
          git config --global core.longpaths true
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # The cc crate resolves the target-appropriate MSVC toolchain itself.
      - run: cargo build --target i686-pc-windows-msvc
      - run: cargo test --target i686-pc-windows-msvc

  # 32-bit ARM Linux (2026-10-02 ruling): armv7 cross-compile; tests run
  # under qemu-user (the only 32-bit shape with a real OpenHarmony
  # counterpart — legacy 32-bit ARM devices).
  arm32:
    name: Build & Test (armv7-linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - name: Install armv7 cross toolchain + qemu-user
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user libc6-armhf-cross libstdc++-12-dev-armhf-cross
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: cargo build --target armv7-unknown-linux-gnueabihf
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      - run: cargo test --target armv7-unknown-linux-gnueabihf
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUNNER: qemu-arm -L /usr/arm-linux-gnueabihf

  # musl is the default Linux platform for distribution (2026-10-02
  # ruling): no glibc floor. GH container jobs can't run on musl (the
  # runner injects a glibc-linked node), so this lane drives an Alpine
  # docker image from the ubuntu host — same pattern as the corpus
  # acquisition. The -crt-static override is required because bindgen
  # dlopens libclang from build scripts (impossible in a fully static
  # musl binary); the fully-static distribution profile is a release task.
  musl:
    name: Build & Test (x86_64-musl, Alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - name: Build & test in Alpine (musl)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w -e CARGO_HOME=/w/target/cargo-home \
            -e RUSTFLAGS="-C target-feature=-crt-static" rust:alpine sh -c '
              set -e
              # libclang package name carries the LLVM major version and
              # rolls forward with Alpine; pick the newest available.
              apk add -q --no-cache build-base ruby ca-certificates
              apk add -q --no-cache $(apk search -q | grep -E "^clang[0-9]+-libclang$" | sort -V | tail -1)
              cargo test --workspace'

  # ── Per-push corpus jobs (the c-P3 job graph) ──────────────────────
  # One job per data-flow test target (tests/<flow>/). Every corpus job
  # shares the same acquisition recipe: sparse submodule clone + rust +
  # ruby + `docker pull` of the digest-pinned image + corpus export (the
  # image bakes everything, incl. the 30 opcode fixtures). Docker is used
  # only for corpus acquisition and the
  # docker oracles (VM compare, dream gate), never for the cargo runs.
  # Wall-time target: ≤12 min per job (measured suites are seconds-to-
  # minutes; the dream gate is the heavyweight at ~3-5 min).

  file-isa:
    name: file-isa (pandasm per-instruction + corpus decode/re-encode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      # modules.abc (Group J) is local-only by license; its test skips by
      # absence.
      - run: cargo test -p abcd-rs --test file-isa --release -- --ignored --nocapture

  hap-file:
    name: hap-file (wild OHOS hap container + decode gates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # The wild hap corpus lives behind the image's `export-wild` command
      # (NOT the plain `export`): 156 packages (145 decode-ok + 11
      # negative-invalid-opcode) with a manifest.json oracle. export-wild
      # requires an empty target directory.
      - name: Acquire the wild hap corpus (image export-wild)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus/wild
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export-wild /work/wild
      # The gate is self-contained: the manifest pins 145/11 and the suite
      # hard-asserts both totals, so corpus drift goes red without a ledger.
      # Skips silently where the corpus is absent (local checkouts).
      - run: cargo test -p abcd-rs --test hap-file --release -- --ignored --nocapture

  file-lift:
    name: file-lift (corpus lift+verify, 5517 incl. test262)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      - run: cargo test -p abcd-rs --test file-lift --release -- --ignored --nocapture

  lift-lower:
    name: lift-lower (rewrite suites + VM oracle ×3 variants)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      # corpus_lower_oracle + determinism + async + regalloc + sendable
      # (test262_vm is excluded — it runs in the dedicated test262-vm job
      # below with its own compare).
      - name: Corpus rewrite suites
        run: cargo test -p abcd-rs --test lift-lower --release -- --ignored --nocapture --skip test262_vm
        env:
          ABCD_LOWERED_DIR: ${{ github.workspace }}/target/lowered-out
      # The python VM oracle compare for all three variants (the script
      # exits nonzero on any behavior mismatch).
      - name: VM oracle compare (v2lift / v2opt / v2inline)
        shell: bash
        run: |
          set -euo pipefail
          for v in v2lift v2opt v2inline; do
            echo "== variant $v"
            python3 scripts/compare-rewritten-corpus.py \
              exports/corpus/index.jsonl "target/lowered-out/$v" \
              --image "$ARK_TEST_IMAGE" --jobs 4 \
              | tee "target/oracle-$v.json" \
              | jq -r '"selected=\(.selected) compared=\(.runtime_compared) passed=\(.passed)"'
          done

  test262-vm:
    name: test262-vm (test262 rewrite + recorded-behavior VM oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      # Rewrites all 2685 test262 rows through the v2lift pipeline and
      # writes candidates + the filtered index to target/test262-vm/
      # (suite default). The suite hard-gates the row count (2685) and
      # the exact 24-row documented encode-skip set (suite header).
      - name: test262 rewrite suite
        run: cargo test -p abcd-rs --test lift-lower --release -- --ignored --nocapture test262_vm
      # VM oracle against the baked runtime records: exit_code/stdout/
      # timeout exact, stderr by error-name normalization (upstream's
      # rule; empirical justification in tests/lift-lower/test262_vm.rs).
      # The gate is pass + documented == total: the 53 documented
      # divergences (24 encode skips + 29 behavior) are checked per-row
      # against scripts/test262-vm-divergences.json — a new undocumented
      # divergence or a stale entry fails the job. Full 2685 rows (no
      # sampling): the compare measured 5m28s at --jobs 4 locally
      # (arm64 docker/qemu — an upper bound for native-amd64 runners),
      # inside the 12-minute budget.
      - name: test262 VM oracle compare (v2lift)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compare-rewritten-corpus.py \
            target/test262-vm/index.jsonl target/test262-vm/v2lift \
            --recorded --recorded-stderr error-name --allow-missing \
            --expect-divergences scripts/test262-vm-divergences.json \
            --image "$ARK_TEST_IMAGE" --jobs 4 \
            | tee target/oracle-test262.json \
            | jq -r '"selected=\(.selected) compared=\(.runtime_compared) passed=\(.passed) missing=\(.missing) divergences=\(.divergences.classes) undocumented=\(.divergences.undocumented | length) stale=\(.divergences.stale | length)"'

  test262-dream:
    name: test262-dream (test262 decompile → es2abc recompile → recorded VM oracle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      # test262 P3: decompile all 2685 recorded test262 rows (asserts
      # the row count and ZERO decompile panics), then recompile each
      # via the image's es2abc (24.0.0.0/baseline, script mode) and
      # compare against the baked runtime record (exit/stdout/timeout
      # exact, stderr by error-name — the upstream test262 rule).
      # Gate form: B-plan ledger (scripts/test262-dream-divergences.json
      # — pass + documented == total; a new undocumented divergence or a
      # stale entry fails the job) + the 2451 pass floor asserted by the
      # oracle test. First-contact histogram (2026-09-27, local qemu
      # --jobs 8): pass 2451 / decompile-bug 225 / es2abc-cant 0 /
      # expected-fallback 9 / fixture-unsupported 0 — the 225 are REAL
      # findings, registered per-row under 15 named classes (suite
      # header in tests/lift-decompile/dream_gate_t262.rs).
      # Wall time: separate job (NOT folded into test262-vm, whose own
      # 2685-row compare already fills its budget). Measured locally
      # (qemu, --jobs 8): generate 6.1s, es2abc recompile ~3m46s, VM
      # compare ~8m6s (inflated by the 86 hang rows' VM timeouts;
      # native-amd64 runners are several times faster and pay no qemu
      # toll) — same shape as the test262-vm job, inside 12 min. Full
      # 2685 rows, no sampling; if a runner regression pushes this over
      # budget, the lever is compare-rewritten-corpus.py --sample N
      # (deterministic every-Nth) — document the sampling decision here.
      - name: test262 dream gate (generate + recompile + recorded compare)
        run: cargo test -p abcd-rs --test lift-decompile --release -- --ignored --nocapture dream_gate_t262_oracle
      - name: Upload the test262 dream-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test262-dream-gate-report
          path: target/dream-gate-t262/dream-gate-report.json
          retention-days: 30
          if-no-files-found: ignore

  lift-analysis:
    name: lift-analysis (callgraph smoke + dom agreement + regions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      - run: cargo test -p abcd-rs --test lift-analysis --release -- --ignored --nocapture

  lift-taint:
    name: lift-taint (probe ladder + corpus smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      # corpus_callee_names is a frequency-count instrument, not a gate —
      # local-only by design.
      - run: cargo test -p abcd-rs --test lift-taint --release -- --ignored --nocapture --skip corpus_callee_names

  lift-decompile:
    name: lift-decompile (stage A/B gates + dream gate + node evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
      # corpus_stage_a + corpus_decompile (2832 non-test262 rows) +
      # dream_gate generate+oracle (docker on the runner) + the node
      # behavior suites (node is preinstalled on runners). textual_oracle
      # is a report-only instrument — local-only by design.
      - run: cargo test -p abcd-rs --test lift-decompile --release -- --ignored --nocapture --skip textual_oracle --skip dream_gate_t262
      - name: Upload the dream-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream-gate-report
          path: target/dream-gate/dream-gate-report.json
          retention-days: 30
          if-no-files-found: ignore

  # Full-estate coverage: the corpus-inclusive metric (the "90%" number)
  # — everything, including the ignored corpus suites, with the corpus
  # export present.
  coverage:
    name: Coverage (full estate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, build, build32, win32, arm32, musl]
    env:
      # clang-23, matching the LLVM bundled by rustc >=1.99 (LLVM 23 changed
      # the __llvm_profile_data record layout; an older clang's instrumented
      # bridge objects mixed into the same profraw section SIGSEGV the test
      # binary at exit — q-P13 root cause). Pinned rustc remains @stable.
      CXX: clang++-23
    steps:
      - uses: actions/checkout@v4
      # See the build job for why: sparse, non-recursive, blob:none.
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Acquire the corpus (image export + opcode fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
          # The wild hap corpus too: --include-ignored runs the hap-file
          # gate, and it must not silently skip here. export-wild requires
          # an empty target directory.
          mkdir -p exports/corpus/wild
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export-wild /work/wild

      # NOTE: No actions/cache here on purpose. Do NOT add it back.
      - name: Install clang-23 (LLVM version parity with rustc's bundled LLVM)
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          clang++-23 --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect coverage (full estate incl. the corpus suites)
        # --skip pandasm_asm: the two asm round-trip gates are byte-loop-heavy
        # (parse+encode+decode+emit x5517 x2) and llvm-cov instrumentation
        # multiplies them past 2h on a 4-vCPU runner (measured: 67s plain
        # release -> 30min+ instrumented on a 16-core box). Their behavioral
        # gating is owned per-push by the file-isa job; the parser keeps its
        # unit-test (incl. fuzz) coverage. (q-P10 ruling A, 2026-09-30)
        # --skip wild_smoke: the wild big-abc smoke sweep is a local
        # instrument (decompile-heavy: p95 18s per module x242) owned by the
        # hap-file job's cheap gate; under instrumentation it dominates the
        # job for zero coverage value. (2026-10-01 maintainer ruling)
        run: cargo llvm-cov --workspace --release --lcov --output-path lcov.info -- --include-ignored --skip pandasm_asm --skip wild_smoke

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30

  # AddressSanitizer at coverage's level (2026-10-02 ruling): one dedicated
  # heavy job, off the critical path. Sanitizers are nightly-only in Rust
  # (-Zsanitizer), ~2x slower, incompatible with -C instrument-coverage,
  # and unavailable on the Windows lanes — hence a lane, not "everywhere".
  #
  # Scope (same ruling, option 2): the corpus-compute suites that actually
  # hammer the FFI boundary (decode/encode/lift/lower over 5517 fixtures +
  # the 156 wild packages) run under ASan — ASan's ~2x tax is affordable
  # there (unlike llvm-cov's 50x). Excluded: the docker oracles (the VM and
  # es2abc live in the image, not our code — ASan has nothing to check) and
  # the two local instruments (pandasm_asm / wild_smoke, same as coverage).
  asan:
    name: ASan (nightly, address sanitizer, corpus-compute suites)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [fmt, build, build32, win32, arm32, musl]
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone the arkcompiler_runtime_core submodules
        shell: bash
        run: |
          set -euo pipefail
          for sm in abcd-isa-sys/arkcompiler_runtime_core abcd-file-sys/arkcompiler_runtime_core; do
            sha=$(git ls-tree HEAD "$sm" | awk '{print $3}')
            url=$(git config -f .gitmodules "submodule.$sm.url")
            git clone --quiet --depth 1 --filter=blob:none --sparse "$url" "$sm"
            git -C "$sm" sparse-checkout set --cone               isa libpandafile libpandabase assembler templates platforms
            git -C "$sm" fetch --quiet --depth 1 origin "$sha"
            git -C "$sm" checkout --quiet -f "$sha"
          done
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Acquire the corpus (image export + wild haps)
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ARK_TEST_IMAGE"
          mkdir -p exports/corpus
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export /work
          mkdir -p exports/corpus/wild
          docker run --rm --platform linux/amd64 -v "$PWD/exports/corpus:/work" "$ARK_TEST_IMAGE" export-wild /work/wild

      # Default (non-ignored) tests first, then the corpus-compute targets.
      # lift-lower skips test262_vm (docker VM compare — nothing for ASan).
      # lift-decompile and test262-dream are docker-oracle suites: out.
      - name: cargo test under ASan
        env:
          CFLAGS: -fsanitize=address
          CXXFLAGS: -fsanitize=address
          ASAN_OPTIONS: detect_leaks=1
        # Sanitizer builds must not inherit the warning elevation. Doctests
        # are out: rustdoc's separate link step misses rustc's bundled ASan
        # runtime (undefined __asan_* from the instrumented bridge objects);
        # they run on every other job.
        run: |
          set -euo pipefail
          export RUSTFLAGS="-Zsanitizer=address"
          cargo test --workspace --lib --tests --target x86_64-unknown-linux-gnu -Zbuild-std
          for t in file-isa file-lift hap-file lift-analysis lift-taint; do
            cargo test -p abcd-rs --test "$t" --release --target x86_64-unknown-linux-gnu -Zbuild-std -- --ignored --nocapture --skip pandasm_asm --skip wild_smoke
          done
          cargo test -p abcd-rs --test lift-lower --release --target x86_64-unknown-linux-gnu -Zbuild-std -- --ignored --nocapture --skip test262_vm
