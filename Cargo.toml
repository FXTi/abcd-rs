# Root package: exists so the cross-crate integration suites under tests/
# (migrated out of the member crates; each target is named in data-flow
# order of the crates it exercises) have a home. The member crates are
# unchanged; their own L1 unit/integration tests stay in-tree.
[package]
name = "abcd-rs"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = [
    "abcd-isa-sys",
    "abcd-isa",
    "abcd-file-sys",
    "abcd-file",
    "abcd-ir",
    "abcd-lift",
    "abcd-lower",
    "abcd-opt",
    "abcd-analysis",
    "abcd-taint",
    "abcd-decompile",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
memmap2 = "0.9"
log = "0.4"
env_logger = "0.11"
bitflags = "2"
string-interner = "0.19"

abcd-isa-sys = { path = "abcd-isa-sys" }
abcd-isa = { path = "abcd-isa" }
abcd-file-sys = { path = "abcd-file-sys" }
abcd-file = { path = "abcd-file" }
abcd-ir = { path = "abcd-ir" }
abcd-lift = { path = "abcd-lift" }
abcd-lower = { path = "abcd-lower" }
abcd-opt = { path = "abcd-opt" }
abcd-analysis = { path = "abcd-analysis" }
abcd-taint = { path = "abcd-taint" }
abcd-decompile = { path = "abcd-decompile" }

# Dev-dependencies of the root package: exactly the crates the migrated
# cross-crate suites under tests/ link against (plus serde_json for the
# corpus-manifest parsing in tests/file-isa, matching abcd-file's dev-dep).
[dev-dependencies]
abcd-isa = { workspace = true }
abcd-file-sys = { workspace = true }
abcd-file = { workspace = true }
abcd-ir = { workspace = true }
abcd-lift = { workspace = true }
abcd-lower = { workspace = true }
abcd-opt = { workspace = true }
abcd-analysis = { workspace = true }
abcd-taint = { workspace = true }
abcd-decompile = { workspace = true }
serde_json = "1"
