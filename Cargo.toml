# Root package: exists so the cross-crate integration suites under tests/
# (migrated out of the member crates; each target is named in data-flow
# order of the crates it exercises) have a home. The member crates are
# unchanged; their own L1 unit/integration tests stay in-tree.
[package]
name = "abcd-rs"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

[lints]
workspace = true

[workspace]
resolver = "3"
members = [
    "abcd-isa-sys",
    "abcd-isa",
    "abcd-file-sys",
    "abcd-file",
    "abcd-ir",
    "abcd-lift",
    "abcd-lower",
    "abcd-opt",
    "abcd-analysis",
    "abcd-taint",
    "abcd-decompile",
    "abcd-hap",
    "abcd-cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
toml = "0.9"
mimalloc = "0.1"
miniz_oxide = "0.9"
rayon = "1"
libm = { version = "0.2", default-features = false }

abcd-isa-sys = { path = "abcd-isa-sys" }
abcd-isa = { path = "abcd-isa" }
abcd-file-sys = { path = "abcd-file-sys" }
abcd-file = { path = "abcd-file" }
abcd-ir = { path = "abcd-ir" }
abcd-lift = { path = "abcd-lift" }
abcd-lower = { path = "abcd-lower" }
abcd-opt = { path = "abcd-opt" }
abcd-analysis = { path = "abcd-analysis" }
abcd-taint = { path = "abcd-taint" }
abcd-decompile = { path = "abcd-decompile" }
abcd-hap = { path = "abcd-hap" }

# (The root package has no runtime dependencies by design: it exists only
# as the cross-crate test container; the shippable binary is abcd-cli.)

# Dev-dependencies of the root package: exactly the crates the migrated
# cross-crate suites under tests/ link against (plus serde_json for the
# corpus-manifest parsing in tests/file-isa, matching abcd-file's dev-dep).
[dev-dependencies]
abcd-isa = { workspace = true }
abcd-file-sys = { workspace = true }
abcd-file = { workspace = true }
abcd-ir = { workspace = true }
abcd-lift = { workspace = true }
abcd-lower = { workspace = true }
abcd-opt = { workspace = true }
abcd-analysis = { workspace = true }
abcd-taint = { workspace = true }
abcd-decompile = { workspace = true }
abcd-hap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Test-only: the corpus gates' per-fixture loops parallelize with rayon
# (cargo's harness parallelism splits across test FUNCTIONS, not the
# fixture loop inside one gate). Aggregation stays deterministic: every
# per-fixture result is collected in fixture order and folded serially.
rayon = { workspace = true }
