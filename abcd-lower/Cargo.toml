[package]
name = "abcd-lower"
description = "IR → ArkCompiler bytecode lowering (abcd_ir::Module → abcd_file::MethodBody)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
readme = "README.md"

# Crate-graph invariant (design/ir.md §1, §5): layering is lift =
# decode→IR, opt = IR→IR, lower = IR→file. The lower pipeline is the ONLY
# IR consumer allowed to see the format layer. The LIBRARY may depend on
# `abcd-ir` (the IR, including shared CFG/DomTree/ExceptionHandlerMap
# infrastructure), `abcd-file` + `abcd-isa` (the container end), and NOTHING
# else from this workspace — in particular never on `abcd-analysis`,
# `abcd-lift` (the forward direction), or `abcd-opt`. Integration tests under
# `tests/` pull `abcd-lift` / `abcd-opt` as dev-dependencies only to verify
# end-to-end round-trips.
[dependencies]
abcd-ir = { workspace = true }
abcd-file = { workspace = true }
abcd-isa = { workspace = true }
hashbrown = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
abcd-lift = { workspace = true }
abcd-opt = { workspace = true }

[lints]
workspace = true
