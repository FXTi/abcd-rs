[package]
name = "abcd-decompile"
description = "Bytecode → JS/TS decompiler on the SSA IR: expression recovery, pattern-independent structuring, JS/TS emission"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
readme = "README.md"

# Crate-graph invariant (design/decompile.md §3.1): abcd-decompile is a pure
# consumer of abcd-ir + abcd-analysis and must NEVER depend on the format crates
# (abcd-file/abcd-isa/abcd-file-sys/abcd-isa-sys) nor on abcd-lift/abcd-lower/
# abcd-opt in its library. Selected integration tests under tests/ pull
# abcd-file + abcd-isa + abcd-lift as DEV-dependencies only; full corpus and
# wild-package recompile gates live in workspace-level `tests/lift-decompile/`.
#
# Pipeline rule (design/decompile.md §3.2): the `abcd-opt` `inline` pass
# must never run before decompile — it destroys function boundaries.
[dependencies]
abcd-ir = { workspace = true }
abcd-analysis = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
abcd-file = { workspace = true }
abcd-isa = { workspace = true }
abcd-lift = { workspace = true }

[lints]
workspace = true
