[package]
name = "abcd-cli"
description = "Command-line interface for the abcd-rs ArkCompiler bytecode toolkit (extract / info / decompile)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "abcd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
abcd-file.workspace = true
abcd-hap.workspace = true
abcd-ir.workspace = true
abcd-lift.workspace = true
abcd-opt.workspace = true
abcd-lower.workspace = true
abcd-analysis.workspace = true
abcd-taint.workspace = true
abcd-decompile.workspace = true
toml.workspace = true

# Final-binary allocator (2026-10-02 ruling, revised same-day): mimalloc
# EVERYWHERE — one allocator, every platform. Libraries never set a global
# allocator; only this binary does.
[dependencies.mimalloc]
workspace = true

[dev-dependencies]
# Synthetic-fixture construction for tests (zero binary fixtures rule).
abcd-isa.workspace = true
