coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        # auto (baseline-following, ±5%): the CI-dark arms that made a
        # hard 80% misfire are gone since the coverage job is full-estate,
        # but auto keeps the signal honest without training reviewers to
        # ignore red (maintainer ruling 2026-09-26).
        target: auto
        threshold: 5%
comment:
  layout: "reach,diff,flags,files"
  behavior: default
ignore:
  - "**/build.rs"
  # Vendored OpenHarmony submodule sources (R4): not our code, not measured.
  - "**/arkcompiler_runtime_core/**"
