coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 80%
comment:
  layout: "reach,diff,flags,files"
  behavior: default
ignore:
  - "**/build.rs"
  # Vendored OpenHarmony submodule sources (R4): not our code, not measured.
  - "**/arkcompiler_runtime_core/**"
