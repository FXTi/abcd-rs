# cargo-deny policy (added 2026-10-02 with the CI deny gate).
# Licenses: explicit allowlist — the project's own crates are Apache-2.0;
# every entry below appears in the current dependency tree. Anything new
# fails the gate loudly and gets reviewed here first.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
# Default: any unpatched RustSec advisory in the tree fails the gate.

[bans]
# Warn (not deny) on duplicate versions for now — the tree is small and
# duplicates are visible noise; promote to deny if they ever creep in.
multiple-versions = "warn"
