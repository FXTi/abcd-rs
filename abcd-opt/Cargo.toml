[package]
name = "abcd-opt"
description = "Optimization passes for the SSA IR (abcd_ir::Module): peephole, SCCP, ADCE + CFG simplify, copyprop, inline (design/ir-v0.2.md)"
edition.workspace = true
license.workspace = true
version.workspace = true

# DELIBERATE INVARIANT (design/ir-v0.2.md §1, design/ir.md §8 invariant 1,
# same enforcement mechanism as abcd-ir): layering is lift = decode→IR,
# opt = IR→IR, lower = IR→file. The passes are FORMAT-INDEPENDENT — they
# see `abcd_ir::Module` and nothing else. This crate's [dependencies]
# must ONLY ever list `abcd-ir` (the IR) — never abcd-file, abcd-isa,
# abcd-file-sys, abcd-isa-sys (the container/ISA layer), abcd-lift, or
# abcd-lower. The format-coupled crates appear exclusively under
# [dev-dependencies], where the regression tests build bytecode files and
# drive the decode → lift → optimize → lower pipeline end-to-end.
[dependencies]
abcd-ir = { workspace = true }

[dev-dependencies]
abcd-file = { workspace = true }
abcd-isa = { workspace = true }
abcd-lift = { workspace = true }
abcd-lower = { workspace = true }
