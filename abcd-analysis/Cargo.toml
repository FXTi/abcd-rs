[package]
name = "abcd-analysis"
description = "Analysis infrastructure on the SSA IR: dominators, region trees, IFDS solver, rungs 0–2 PTA, call graph"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
readme = "README.md"

# Crate-graph invariant (design/ir.md, design/analysis.md):
# analysis infra is strictly format-independent and never depends on abcd-file /
# abcd-isa / abcd-lift / abcd-lower / abcd-opt. The LIBRARY consumes only
# `abcd-ir`; integration tests under `tests/` pull `abcd-file` and `abcd-lift`
# as DEV-dependencies only to drive decode -> lift on real bytecode modules.
[dependencies]
abcd-ir = { workspace = true }

[dev-dependencies]
abcd-file = { workspace = true }
abcd-lift = { workspace = true }

[lints]
workspace = true
