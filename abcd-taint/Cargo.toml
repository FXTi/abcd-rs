[package]
name = "abcd-taint"
description = "Interprocedural IFDS taint analysis on the SSA IR: access-path facts, summaries, callback gaps, prototype resolution"
edition.workspace = true
license.workspace = true
version.workspace = true
readme = "README.md"

# Crate-graph invariant (design/analysis.md): taint analysis consumes
# ONLY `abcd-ir` (the IR) and `abcd-analysis` (the IFDS solver, heap
# model, call graph). It never depends on the format/pipeline crates
# abcd-file/abcd-isa/abcd-lift/abcd-lower/abcd-opt in the LIBRARY — the
# corpus smoke test under tests/ pulls `abcd-file`/`abcd-lift` as
# DEV-dependencies only (they drive decode → lift to obtain real modules).
[dependencies]
abcd-ir = { workspace = true }
abcd-analysis = { workspace = true }

[dev-dependencies]
abcd-file = { workspace = true }
abcd-lift = { workspace = true }
